<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="霸王喵表情循环切换">
  <!-- ===== 固定部分：耳朵 ===== -->
  <polygon points="50,45 28,98 78,92" fill="#F5C2E7"/>
  <polygon points="190,45 212,98 162,92" fill="#F5C2E7"/>
  <!-- 内耳 -->
  <polygon points="50,55 37,88 68,84" fill="#E8A2C8"/>
  <polygon points="190,55 203,88 172,84" fill="#E8A2C8"/>

  <!-- ===== 固定部分：脸 ===== -->
  <ellipse cx="120" cy="140" rx="80" ry="70" fill="#F5C2E7"/>

  <!-- ===== 固定部分：胡须 ===== -->
  <g stroke="#1E1E2E" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="135" x2="28" y2="125"/>
    <line x1="68" y1="142" x2="25" y2="142"/>
    <line x1="68" y1="149" x2="28" y2="159"/>
    <line x1="172" y1="135" x2="212" y2="125"/>
    <line x1="172" y1="142" x2="215" y2="142"/>
    <line x1="172" y1="149" x2="212" y2="159"/>
  </g>

  <!-- ===== 固定部分：腮红 ===== -->
  <ellipse cx="80" cy="158" rx="14" ry="9" fill="#F2A0B5" opacity="0.55"/>
  <ellipse cx="160" cy="158" rx="14" ry="9" fill="#F2A0B5" opacity="0.55"/>

  <!-- ===== 表情1：装可爱 =^.^= （0-2s）===== -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.25;0.5;0.5;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
    <g stroke="#1E1E2E" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 80 128 Q 95 115 110 128"/>
      <path d="M 130 128 Q 145 115 160 128"/>
      <path d="M 105 168 Q 120 180 135 168"/>
    </g>
  </g>

  <!-- ===== 表情2：开心 =ω= （2-4s）===== -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.25;0.5;0.5;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
    <g stroke="#1E1E2E" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 80 122 Q 95 135 110 122"/>
      <path d="M 130 122 Q 145 135 160 122"/>
      <path d="M 100 162 Q 120 185 140 162"/>
    </g>
  </g>

  <!-- ===== 表情3：惊讶 =口= （4-6s）===== -->
  <g>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.25;0.25;0.5;0.5;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
    <g fill="#1E1E2E">
      <circle cx="95" cy="128" r="7"/>
      <circle cx="145" cy="128" r="7"/>
      <ellipse cx="120" cy="170" rx="13" ry="9"/>
    </g>
  </g>

  <!-- ===== 表情4：得意 =▽= （6-8s）===== -->
  <g>
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.25;0.25;0.5;0.5;0.75;0.75;1" dur="8s" repeatCount="indefinite"/>
    <g stroke="#1E1E2E" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="80" y1="128" x2="110" y2="128"/>
      <line x1="130" y1="128" x2="160" y2="128"/>
      <path d="M 106 160 L 120 178 L 134 160"/>
    </g>
  </g>
</svg>
